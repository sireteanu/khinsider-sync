[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khinsider-sync"
version = "1.0.19"
description = "Browse every khinsider.com soundtrack in a web interface and keep the albums you pick in sync"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "curl_cffi>=0.7",
    "mutagen>=1.45",
    "Pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyflakes>=3"]

[project.scripts]
khinsider-sync = "khinsider_sync.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
khinsider_sync = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
