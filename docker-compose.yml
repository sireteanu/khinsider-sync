services:
  khinsider-sync:
    build: .
    image: khinsider-sync:latest
    container_name: khinsider-sync
    ports:
      - "8485:8485"
    volumes:
      - ./config:/config          # catalog, settings and selection
      - /path/to/music:/data      # where synced files go - change to your share
    environment:
      - PUID=99                   # Unraid: nobody
      - PGID=100                  # Unraid: users
      - UMASK=000
      - TZ=America/New_York        # used for file dates and the schedule
      # - KHINSIDER_PASSWORD=change-me   # ask for a password in the browser
      # - FLARESOLVERR_URL=http://flaresolverr:8191   # optional, see the flaresolverr service below
    restart: on-failure            # restarts after a crash; stays off after "Shut down"

  # Optional: FlareSolverr gets pages past Cloudflare's browser check when one comes. Uncomment this
  # service and FLARESOLVERR_URL above (or set the address in Settings).
  # flaresolverr:
  #   image: ghcr.io/flaresolverr/flaresolverr:latest
  #   container_name: flaresolverr
  #   environment:
  #     - TZ=America/New_York
  #   restart: unless-stopped
