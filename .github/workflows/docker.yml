# Optional: builds the Docker image in the cloud and publishes it to
#   - GitHub Container Registry: ghcr.io/<github-name>/khinsider-sync   (always)
#   - Docker Hub:                docker.io/<docker-hub-name>/khinsider-sync
#     only once these are set in the GitHub repo (Settings > Secrets and variables > Actions):
#       Variables tab: DOCKERHUB_USERNAME = your Docker Hub user name
#       Secrets tab:   DOCKERHUB_TOKEN    = a Docker Hub access token (Read & Write)
# Unraid's template pulls one of these images.
name: Docker image
# Not run on every push: the image is built on the Unraid server (docker/unraid-update.sh).
# Start it by hand (Actions > Docker image > Run workflow) if you ever want a published image.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@v4
      - name: Image names (registries need lowercase)
        run: |
          echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/khinsider-sync" >> "$GITHUB_ENV"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            echo "HUB_IMAGE=docker.io/${DOCKERHUB_USERNAME,,}/khinsider-sync" >> "$GITHUB_ENV"
          fi
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            name=${{ env.HUB_IMAGE }},enable=${{ env.HUB_IMAGE != '' }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
