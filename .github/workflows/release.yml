# Creates a GitHub release (v<version>) the first time a new version in pyproject.toml reaches main.
# Its text is that version's section of CHANGELOG.md ("## [1.2.0] - date"); without one, GitHub
# writes notes from the commits. Every change gets a new version; an existing release's text is only
# brought back in line with its CHANGELOG.md section when that section is corrected (e.g. a typo or
# something that shouldn't be public). To release: add the changelog section, raise the version, push.
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release the version in pyproject.toml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tag="v$version"
          # this version's section of CHANGELOG.md, without its heading
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          v = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read() if __import__("os").path.exists("CHANGELOG.md") else ""
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else "")
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag is already released"
          elif [ -s notes.md ]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "Khinsider Sync $version" --notes-file notes.md
            echo "Released $tag from CHANGELOG.md"
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Khinsider Sync $version" --generate-notes
            echo "Released $tag (no CHANGELOG.md section - notes generated from commits)"
          fi
      - name: Keep released notes in line with corrected CHANGELOG.md sections
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY' > sections.tsv
          import re
          text = open("CHANGELOG.md", encoding="utf-8").read()
          for m in re.finditer(r"^## \[(\d+\.\d+\.\d+)\][^\n]*\n(.*?)(?=^## \[|\Z)", text, re.M | re.S):
              open(f"notes-{m.group(1)}.md", "w", encoding="utf-8").write(m.group(2).strip() + "\n")
              print(m.group(1))
          PY
          for v in $(cat sections.tsv); do
            gh release view "v$v" --json body --jq .body > current.md 2>/dev/null || continue
            if ! diff -q <(sed -e 's/[[:space:]]*$//' current.md) <(sed -e 's/[[:space:]]*$//' "notes-$v.md") >/dev/null; then
              gh release edit "v$v" --notes-file "notes-$v.md"
              echo "v$v: release text updated from CHANGELOG.md"
            fi
          done
